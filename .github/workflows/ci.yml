name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev

jobs:
  # 1. СТАДИЯ: СБОРКА И ТЕСТИРОВАНИЕ
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Тесты бэкенда
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx fastapi starlette

      - name: Run Backend Tests
        run: |
          python -m pytest

      # Сборка фронтенда
      # Сборка фронтенда
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install frontend dependencies and build
            env:
              PNPM_ONLY_BUILT_DEPENDENCIES: msw,sharp # Подстраховка для pnpm v11 в облаке
        run: |
          cd frontend
          pnpm install --no-frozen-lockfile
          pnpm build
          
  # 2. СТАДИЯ: ДЕПЛОЙ НА СЕРВЕР (запустится только если build-and-test прошёл успешно)
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/projects/AudioTrimmer
            
            # Синхронизируем ветку (main или dev)
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            
            # Перезапускаем контейнеры
            docker compose up -d --build
            
            # Чистим мусор за сборщиком
            docker image prune -f
            docker builder prune -f
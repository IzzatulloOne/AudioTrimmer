name: AudioTrimmer CI

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем актуальный код репозитория
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. Быстрая проверка синтаксиса конфигурации docker-compose
      - name: Verify Docker Compose configuration
        run: docker compose config

      # 3. Собираем и поднимаем контейнеры (принудительный билд игнорирует старый кэш)
      - name: Build and Start Docker Containers
        run: |
          docker compose up -d --build
          echo "Ожидаем полную инициализацию приложения..."
          sleep 5
          docker compose ps

      # 4. Запускаем тесты внутри свежесобранного контейнера
      - name: Run Pytest inside Docker container
        run: docker compose exec -T web python -m pytest
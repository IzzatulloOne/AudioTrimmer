name: AudioTrimmer CI

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код репозитория
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. Проверяем синтаксис docker-compose.yml перед сборкой
      - name: Verify Docker Compose configuration
        run: docker compose config

      # 3. Запускаем сборку образов
      - name: Build Docker images
        run: docker compose build

      # 4. Проверяем, что контейнеры успешно поднимаются
      - name: Test Docker Compose up
        run: |
          docker compose up -d
          echo "Ожидаем запуск контейнеров..."
          sleep 5
          docker compose ps
      # 4. Проверяем, что контейнеры успешно поднимаются и проходят тесты
      - name: Run Pytest inside Docker container
        run: |
          docker compose up -d
          echo "Ожидаем полную инициализацию приложения..."
          sleep 5
          
          # Запускаем pytest внутри контейнера с именем 'web'
          # Флаг -T отключает псевдо-TTY (нужно для работы в CI системах)
          docker compose exec -T web pytest
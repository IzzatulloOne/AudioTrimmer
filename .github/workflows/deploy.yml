name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v3
        with:
          version: 9 # Или используй ту версию, что у тебя локально
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Frontend Tests
        run: pnpm test

      # Бэкенд тесты (если лежат в корне)
      - name: Backend Tests
        run: |
          docker run --rm -v ${{ github.workspace }}:/app python:3.11 \
          bash -c "pip install pytest httpx && pytest /app/tests"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/projects/AudioTrimmer
            git pull
            pnpm install
            pnpm build
            docker compose build
            docker compose up -d
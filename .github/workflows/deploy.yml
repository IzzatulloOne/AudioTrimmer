name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev

jobs:
  # 1. СТАДИЯ: ТЕСТИРОВАНИЕ И СБОРКА (Testing & Build Check)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Проверка бэкенда
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx fastapi starlette

      - name: Run Backend Tests
        run: |
          python -m pytest

      # Проверка фронтенда (собирается ли Next.js без ошибок)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # <--- МЕНЯЕМ ТУТ С 20 НА 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      # Добавляем флаг, чтобы не было капризов с блокировкой файла
      - name: Install frontend dependencies and build
        run: |
          cd frontend
          pnpm install --no-frozen-lockfile
          pnpm build

  # 2. СТАДИЯ: ДЕПЛОЙ И ОЧИСТКА (Deploy & Cleanup)
  deploy:
    needs: test  # Деплой начнется только если тесты прошли успешно
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/projects/AudioTrimmer
            
            # Затягиваем изменения именно той ветки, в которую был пуш
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            
            # Пересобираем и запускаем контейнеры в фоне
            docker compose up -d --build
            
            # Очистка (Cleanup): удаляем кэш сборщика и старые зависшие образы, чтобы не забивать диск сервера
            docker image prune -f
            docker builder prune -f